name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Run unit tests (excludes postgres-integration)
        shell: bash
        run: |
          shopt -s globstar nullglob
          tests=()
          for file in apps/*/dist/**/*.test.js packages/*/dist/**/*.test.js; do
            [[ ${file##*/} == postgres-integration.test.js ]] || tests+=("$file")
          done
          test "${#tests[@]}" -gt 0
          node --test --test-reporter=tap "${tests[@]}"

  integration-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitcoach_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d fitcoach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build
        run: npm run build

      - name: Deploy baseline and run PostgreSQL integration tests
        env:
          FITCOACH_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/fitcoach_test
        run: |
          DATABASE_URL="$FITCOACH_TEST_DATABASE_URL" npm run db:migrate:deploy
          DATABASE_URL="$FITCOACH_TEST_DATABASE_URL" npm run db:migrate:status
          DATABASE_URL="$FITCOACH_TEST_DATABASE_URL" npm exec -- prisma db execute \
            --schema packages/db/prisma/schema.prisma --file packages/db/prisma/verify-baseline.sql
          node --test --test-reporter=tap apps/api/dist/services/__tests__/postgres-integration.test.js
          node --test --test-reporter=tap packages/db/dist/__tests__/persistence.integration.js

      - name: Run HTTP integration tests
        run: node --test --test-reporter=tap apps/api/dist/__tests__/*.integration.js

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build
        run: npm run build
