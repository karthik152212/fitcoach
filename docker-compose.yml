# FitCoach Local PostgreSQL for Development & Testing
# Usage: docker compose up -d
#        docker compose down -v  (to wipe data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitcoach-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitcoach
    ports:
      - "5433:5432"
    volumes:
      - fitcoach_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fitcoach_pg_data: